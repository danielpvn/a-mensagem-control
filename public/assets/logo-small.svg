<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- A Mensagem Control: marca-página (a Mensagem marcada) com o ponto de "gravando/ao vivo".
       O anel em volta do ponto é vazado (transparente). O build/icon.ico e os favicons saem daqui. -->
  <defs>
    <linearGradient id="amc-azul" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#6AA2FF"/>
      <stop offset="1" stop-color="#3470F0"/>
    </linearGradient>
    <linearGradient id="amc-rec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6A5C"/>
      <stop offset="1" stop-color="#D93A30"/>
    </linearGradient>
    <mask id="amc-furo">
      <rect width="120" height="120" fill="#fff"/>
      <circle cx="60" cy="50" r="28" fill="#000"/>
    </mask>
  </defs>
  <path d="M0 16 Q0 0 16 0 H104 Q120 0 120 16 V120 L60 88 L0 120 Z" fill="url(#amc-azul)" mask="url(#amc-furo)"/>
  <circle cx="60" cy="50" r="17" fill="url(#amc-rec)"/>
</svg>
