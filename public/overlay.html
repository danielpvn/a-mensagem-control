<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Mensagem Control - OBS Overlay</title>
  
  <!-- Fontes locais (funcionam sem internet) -->
  <link rel="stylesheet" href="fonts.css">
  
  <link rel="stylesheet" href="overlay.css?v=1.4.0">
</head>
<body>
  <div id="overlay-container" class="overlay-container">
    <div id="overlay-box" class="overlay-box hidden">
      <div id="overlay-title" class="overlay-title"></div>
      <div id="overlay-text" class="overlay-text"></div>
    </div>
  </div>

  <!-- Camadas de tela cheia / faixa embaixo (Hinos e Bíblia) -->
  <div id="hymn-layer" class="screen-layer layout-full hidden">
    <div id="hymn-box" class="screen-box anim-fade">
      <div id="hymn-title" class="screen-title"></div>
      <div class="screen-text-wrap"><div id="hymn-text" class="screen-text lines"></div></div>
      <div id="hymn-label" class="screen-label"></div>
    </div>
  </div>

  <div id="bible-layer" class="screen-layer layout-full hidden">
    <div id="bible-box" class="screen-box anim-fade">
      <div id="bible-title" class="screen-title"></div>
      <div class="screen-text-wrap"><div id="bible-text" class="screen-text prose"></div></div>
      <div id="bible-label" class="screen-label"></div>
    </div>
  </div>

  <!-- Mídia em tela cheia (duas gavetas para a transição) -->
  <div id="media-layer" class="media-layer hidden">
    <div id="media-slot-a" class="media-slot"></div>
    <div id="media-slot-b" class="media-slot"></div>
  </div>

  <!-- Nome do pregador -->
  <div id="lt-layer" class="lt-layer pos-bottom-left look-modern lt-anim-slide hidden">
    <div class="lt-box">
      <div class="lt-name" id="lt-name"></div>
      <div class="lt-subtitle" id="lt-subtitle"></div>
    </div>
  </div>

  <script type="module" src="overlay.js?v=1.4.0"></script>
</body>
</html>
