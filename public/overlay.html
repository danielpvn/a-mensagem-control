<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Mensagem Control - OBS Overlay</title>
  
  <!-- Fontes locais (funcionam sem internet) -->
  <link rel="stylesheet" href="fonts.css">
  
  <link rel="stylesheet" href="overlay.css?v=1.2.0">
</head>
<body>
  <div id="overlay-container" class="overlay-container">
    <div id="overlay-box" class="overlay-box hidden">
      <div id="overlay-title" class="overlay-title"></div>
      <div id="overlay-text" class="overlay-text"></div>
    </div>
  </div>

  <!-- Camada dos hinos (tela cheia ou faixa embaixo) -->
  <div id="hymn-layer" class="hymn-layer layout-full hidden">
    <div id="hymn-box" class="hymn-box anim-fade">
      <div id="hymn-title" class="hymn-title"></div>
      <div class="hymn-text-wrap"><div id="hymn-text" class="hymn-text"></div></div>
      <div id="hymn-label" class="hymn-label"></div>
    </div>
  </div>

  <script type="module" src="overlay.js?v=1.2.0"></script>
</body>
</html>
